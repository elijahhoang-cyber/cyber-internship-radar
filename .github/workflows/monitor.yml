name: Cyber Internship Radar

on:
  schedule:
    # Every five minutes; offset away from the busiest top-of-hour period.
    - cron: '2/5 * * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate discovery/archive stages without spending ToHuman credits'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cyber-internship-radar
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Restore encrypted private letters
        id: private_archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TOHUMAN_VAULT_KEY: ${{ secrets.TOHUMAN_VAULT_KEY }}
        run: python -m humanization.archive restore
      - name: Find newly published internships
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESUME_PROFILE_JSON: ${{ secrets.RESUME_PROFILE_JSON }}
          ENABLE_EXTERNAL_AI: 'false'
          TOHUMAN_ARCHIVE_READY: ${{ steps.private_archive.outputs.ready }}
          TOHUMAN_VAULT_KEY: ${{ secrets.TOHUMAN_VAULT_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python cloud_tracker.py --config config/companies.verified.json
      - name: Preserve encrypted originals before external processing
        id: originals
        if: steps.private_archive.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-letter-vault-${{ github.run_id }}-${{ github.run_attempt }}-originals
          path: private/automation/vault.enc
          if-no-files-found: error
          retention-days: 90
      - name: Humanize future strong matches once
        if: steps.originals.outcome == 'success' && inputs.validate_only != true
        env:
          TOHUMAN_API_KEY: ${{ secrets.TOHUMAN_API_KEY }}
          TOHUMAN_VAULT_KEY: ${{ secrets.TOHUMAN_VAULT_KEY }}
          ENABLE_EXTERNAL_AI: 'false'
        run: python -m humanization.worker process
      - name: Preserve encrypted processed letters before Discord delivery
        id: processed
        if: steps.originals.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: radar-letter-vault-${{ github.run_id }}-${{ github.run_attempt }}-processed
          path: private/automation/vault.enc
          if-no-files-found: error
          retention-days: 90
      - name: Deliver verified rewrite or clearly labeled original
        if: steps.processed.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOHUMAN_VAULT_KEY: ${{ secrets.TOHUMAN_VAULT_KEY }}
        run: python -m humanization.worker deliver
      - name: Limit encrypted archive storage to two snapshots
        if: steps.processed.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m humanization.archive cleanup
      - name: Save persistent state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f state/seen.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No newly detected jobs; nothing to commit."
            exit 0
          fi
          git commit -m 'Update job-monitoring state [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
