name: USAJOBS live pipeline check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: federal-pipeline-check
  cancel-in-progress: false
jobs:
  federal:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify authenticated federal discovery and synthetic application pipeline
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ENABLE_EXTERNAL_AI: 'false'
        run: python -m providers.check_federal
